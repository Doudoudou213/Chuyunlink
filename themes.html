<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>主题专题 · 楚韵链迹</title>
  <style>
    :root { font-family: "Noto Serif SC", "Microsoft YaHei", sans-serif; color: #332a21; background: #f5f0e6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    a { color: inherit; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid #9e2f24; outline-offset: 3px; }
    .page-header { background: linear-gradient(120deg, #211815, #4a211c 72%, #211815); color: #f4e4c7; border-bottom: 4px solid #b99255; }
    .page-header-inner { max-width: 1100px; margin: auto; padding: 18px 22px; display: flex; gap: 18px; align-items: center; justify-content: space-between; }
    .brand { text-decoration: none; font-weight: 800; letter-spacing: .18em; color: #e3bd69; white-space: nowrap; }
    .header-link { font-size: 13px; text-decoration: none; border: 1px solid #a88a5b; border-radius: 4px; min-height: 44px; display: inline-flex; align-items: center; padding: 8px 14px; }
    main { max-width: 1100px; margin: auto; padding: 28px 22px 72px; }
    .eyebrow { color: #9e2f24; font-size: 11px; font-weight: 800; letter-spacing: .14em; margin: 0 0 10px; }
    h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.3; margin: 0; }
    h2 { font-size: clamp(21px, 3vw, 29px); margin: 0 0 12px; }
    h3 { margin: 0 0 8px; font-size: 17px; }
    p { line-height: 1.85; }
    .intro { color: #6b5d4e; max-width: 780px; }
    .status { color: #795f3f; font-size: 14px; min-height: 28px; }
    .theme-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; margin-top: 24px; }
    .theme-card { border: 1px solid #dcc8a6; background: #fffdf8; border-radius: 10px; padding: 22px; box-shadow: 0 8px 24px rgba(37, 25, 15, .04); }
    .theme-card a { display: block; text-decoration: none; }
    .theme-card a:hover h2 { color: #9e2f24; }
    .theme-card-meta { color: #796d5d; font-size: 12px; margin: 16px 0 0; }
    .theme-hero { background: #fffdf8; border: 1px solid #dcc8a6; border-radius: 10px; padding: clamp(20px, 4vw, 44px); }
    .theme-hero .intro { font-size: 16px; }
    .theme-meta { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
    .theme-meta span { background: #f1e8d7; border-radius: 4px; padding: 5px 10px; font-size: 12px; color: #6a5034; }
    .story { margin-top: 30px; display: grid; gap: 20px; }
    .chapter { background: #fffdf8; border: 1px solid #e0d2ba; border-radius: 10px; padding: clamp(20px, 4vw, 36px); }
    .chapter-number { font-size: 11px; letter-spacing: .12em; color: #a04437; font-weight: 800; }
    .chapter-body { font-size: 15px; line-height: 2; white-space: pre-wrap; }
    .chapter-source { margin-top: 20px; border-top: 1px solid #e7dac5; padding-top: 12px; }
    .chapter-source summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; color: #7c3027; font-size: 13px; font-weight: 700; }
    .source-row { padding: 12px 0; border-top: 1px solid #eee4d4; }
    .source-row strong { display: block; font-size: 13px; }
    .source-row p { color: #695e51; font-size: 12px; margin: 4px 0 0; }
    .source-row .adopted-mark { color: #496a61; font-weight: 700; }
    .claim-note { font-size: 12px; color: #705b43; background: #f8f2e7; padding: 10px 12px; border-radius: 5px; margin-top: 14px; }
    .claim-list { display: grid; gap: 9px; margin-top: 18px; }
    .claim-item { border: 1px solid #e7dac5; background: #f8f2e7; border-radius: 6px; }
    .claim-item summary { cursor: pointer; min-height: 44px; padding: 12px 14px; color: #70352d; font-size: 13px; font-weight: 700; line-height: 1.6; }
    .claim-sources { padding: 0 14px 14px; }
    .story-link { display: inline-flex; min-height: 44px; align-items: center; color: #8e3428; font-size: 12px; font-weight: 700; }
    .expand { margin-top: 30px; display: grid; gap: 12px; }
    .expand > details { border: 1px solid #dcc8a6; background: #fffdf8; border-radius: 8px; overflow: hidden; }
    .expand > details > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; min-height: 56px; font-weight: 700; }
    .expand > details > summary::after { content: "展开"; font-size: 12px; color: #9e2f24; }
    .expand > details[open] > summary::after { content: "收起"; }
    .expand-body { padding: 0 22px 22px; border-top: 1px solid #eee2cf; }
    .expand-help { color: #746959; font-size: 12px; }
    .timeline { border-left: 2px solid #c5a766; margin: 22px 0 0 8px; padding-left: 22px; display: grid; gap: 18px; }
    .timeline-item { position: relative; }
    .timeline-item::before { content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #9e2f24; left: -28px; top: 8px; }
    .timeline-item p { margin: 3px 0; font-size: 13px; }
    .map-box { position: relative; aspect-ratio: 2.2 / 1; min-height: 260px; border: 1px solid #d8c6a7; border-radius: 8px;
      background: linear-gradient(90deg, transparent 24%, #e4daca 25%, transparent 26%, transparent 49%, #e4daca 50%, transparent 51%, transparent 74%, #e4daca 75%, transparent 76%),
        linear-gradient(0deg, transparent 24%, #e4daca 25%, transparent 26%, transparent 49%, #e4daca 50%, transparent 51%, transparent 74%, #e4daca 75%, transparent 76%), #f6f0e4; }
    .map-point { position: absolute; transform: translate(-50%, -50%); background: #241a17; color: #fff2d7; border: 2px solid #c5a766; border-radius: 20px;
      min-width: 36px; min-height: 36px; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
    .map-label { position: absolute; transform: translate(-50%, 12px); padding: 4px 8px; background: #fffdf8; border: 1px solid #d8c6a7; border-radius: 4px;
      max-width: 150px; font-size: 11px; line-height: 1.4; text-align: center; }
    .chain-list { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
    .chain-list li { border-left: 3px solid #9e2f24; background: #f8f3e8; padding: 12px 15px; }
    .chain-list small { display: block; color: #76695a; margin-top: 4px; }
    .relation-row { border-top: 1px solid #eee2cf; padding: 12px 0; font-size: 13px; }
    .back-link { display: inline-flex; align-items: center; min-height: 44px; margin-bottom: 15px; color: #8e3428; font-weight: 700; text-decoration: none; }
    .closing { margin: 24px 0; border-left: 4px solid #9e2f24; background: #fffdf8; padding: 15px 22px; }
    @media (max-width: 600px) {
      .page-header-inner { padding: 14px 16px; }
      main { padding: 22px 16px 58px; }
      .map-box { aspect-ratio: 1.25 / 1; }
      .map-label { font-size: 10px; max-width: 95px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="page-header-inner"><a class="brand" href="./index.html">楚韵链迹</a>
      <a class="header-link" href="./index.html">返回发现页</a></div>
  </header>
  <main>
    <div id="theme-status" class="status" role="status" aria-live="polite">正在读取专题…</div>
    <div id="theme-content"></div>
  </main>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js"></script>
  <script src="./static/theme-page.js"></script>
</body>
</html>
