<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>楚韵链迹 · 内容管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { background: #f5f2e9; color: #172b2a; }
  </style>
</head>
<body class="min-h-screen">
  <header class="bg-[#123c3a] text-white shadow-lg">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-4">
      <div>
        <h1 class="text-xl font-bold text-[#d9ad52]">楚韵链迹 · 内容管理</h1>
<p class="mt-1 text-xs text-stone-300">投稿审核、互动与评论管理、内容举报、用户反馈与兑换码核销</p>
      </div>
      <div class="flex gap-2">
        <a href="./index.html" class="rounded-lg border border-white/20 px-3 py-2 text-xs font-bold">返回前台</a>
        <button id="logout" class="hidden rounded-lg bg-white/10 px-3 py-2 text-xs font-bold">退出登录</button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl space-y-5 px-4 py-6">
    <section id="login-panel" class="mx-auto max-w-md rounded-2xl border border-stone-200 bg-white p-5 shadow-sm">
      <h2 class="text-base font-bold">管理员登录</h2>
      <p class="mt-1 text-xs text-stone-500">使用已授权的管理员账号登录。</p>
      <form id="login-form" class="mt-4 space-y-3">
        <input id="username" autocomplete="username" placeholder="邮箱或用户名" class="w-full rounded-xl border border-stone-200 px-3 py-2.5 text-sm outline-none focus:border-[#d9ad52]" required>
        <input id="password" type="password" autocomplete="current-password" placeholder="密码" class="w-full rounded-xl border border-stone-200 px-3 py-2.5 text-sm outline-none focus:border-[#d9ad52]" required>
        <button type="submit" class="w-full rounded-xl bg-[#123c3a] px-3 py-2.5 text-sm font-bold text-[#d9ad52]">登录</button>
      </form>
      <p id="login-message" class="mt-3 min-h-5 whitespace-pre-wrap text-xs text-stone-500"></p>
    </section>

    <section id="admin-panel" class="hidden space-y-5">
      <div class="rounded-2xl border border-stone-200 bg-white p-4 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <p id="identity" class="break-all text-xs text-stone-600"></p>
            <p id="message" class="mt-2 text-xs text-emerald-700"></p>
          </div>
          <div id="admin-navigation" class="flex flex-wrap gap-2">
            <button id="refresh" data-admin-view="submissions" class="rounded-lg bg-[#123c3a] px-4 py-2 text-xs font-bold text-[#d9ad52]">待审投稿</button>
            <button id="resource-binding-refresh" data-admin-view="resource-bindings" class="rounded-lg border border-stone-200 bg-white px-4 py-2 text-xs font-bold text-stone-600">投稿关联</button>
            <button id="supplement-refresh" data-admin-view="supplements" class="rounded-lg border border-stone-200 bg-white px-4 py-2 text-xs font-bold text-stone-600">待审补充</button>
            <button id="comment-refresh" data-admin-view="comments" class="rounded-lg border border-stone-200 bg-white px-4 py-2 text-xs font-bold text-stone-600">评论管理</button>
            <button id="report-refresh" data-admin-view="reports" class="rounded-lg border border-stone-200 bg-white px-4 py-2 text-xs font-bold text-stone-600">内容举报</button>
            <button id="feedback-refresh" data-admin-view="feedback" class="rounded-lg border border-stone-200 bg-white px-4 py-2 text-xs font-bold text-stone-600">用户反馈</button>
            <button id="redemption-refresh" data-admin-view="redemptions" class="rounded-lg border border-stone-200 bg-white px-4 py-2 text-xs font-bold text-stone-600">兑换码核销</button>
            <button id="story-links-refresh" data-admin-view="story-links" class="rounded-lg border border-stone-200 bg-white px-4 py-2 text-xs font-bold text-stone-600">链迹关联</button>
            <button id="story-drafts-refresh" data-admin-view="story-drafts" class="rounded-lg border border-stone-200 bg-white px-4 py-2 text-xs font-bold text-stone-600">故事草稿</button>
            <button id="ai-status-refresh" data-admin-view="ai-status" class="rounded-lg border border-stone-200 bg-white px-4 py-2 text-xs font-bold text-stone-600">AI 接口</button>
            <button id="material-analysis-refresh" data-admin-view="material-analysis" class="rounded-lg border border-stone-200 bg-white px-4 py-2 text-xs font-bold text-stone-600">材料识别</button>
            <button id="resource-preview-refresh" data-admin-view="resource-preview" class="rounded-lg border border-stone-200 bg-white px-4 py-2 text-xs font-bold text-stone-600">资源迁移预览</button>
          </div>
        </div>
      </div>
      <div class="flex items-center justify-between px-1">
        <h2 id="view-title" class="text-sm font-bold text-stone-800">待审投稿</h2>
        <span id="view-count" class="text-xs text-stone-400"></span>
      </div>
      <div id="comment-filters" class="hidden flex flex-wrap items-center gap-2 rounded-2xl border border-stone-200 bg-white p-3 shadow-sm">
        <label class="text-xs font-bold text-stone-600" for="comment-status-filter">状态</label>
        <select id="comment-status-filter" class="rounded-lg border border-stone-200 bg-stone-50 px-3 py-2 text-xs outline-none focus:border-[#123c3a]">
          <option value="visible">公开中</option>
          <option value="hidden">已隐藏</option>
          <option value="deleted">用户已删除</option>
          <option value="all">全部状态</option>
        </select>
        <label class="ml-2 text-xs font-bold text-stone-600" for="comment-target-filter">内容类型</label>
        <select id="comment-target-filter" class="rounded-lg border border-stone-200 bg-stone-50 px-3 py-2 text-xs outline-none focus:border-[#123c3a]">
          <option value="all">全部内容</option>
          <option value="submission">社区投稿</option>
          <option value="hotspot">濒危热点</option>
          <option value="landmark">地图地标</option>
          <option value="activity">社区活动</option>
          <option value="content">发现内容</option>
        </select>
        <button id="comment-filter-apply" type="button" class="rounded-lg bg-[#123c3a] px-4 py-2 text-xs font-bold text-[#d9ad52]">应用筛选</button>
      </div>
      <div id="list" class="grid gap-4"></div>
    </section>
  </main>

  <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js"></script>
  <script>
    const ENV_ID = "chulink-legacy-d8god1687a5d60743";
    const REGION = "ap-shanghai";
    const FUNCTION_NAME = "adminSubmissions";
    const AI_FUNCTION_NAME = "storyWorker";
    const MATERIAL_FUNCTION_NAME = "materialWorker";
    const app = cloudbase.init({ env: ENV_ID, region: REGION });
    const auth = app.auth({ persistence: "local" });

    const loginPanel = document.getElementById("login-panel");
    const adminPanel = document.getElementById("admin-panel");
    const loginMessage = document.getElementById("login-message");
    const identity = document.getElementById("identity");
    const message = document.getElementById("message");
    const list = document.getElementById("list");
    const logoutButton = document.getElementById("logout");
    const viewTitle = document.getElementById("view-title");
    const viewCount = document.getElementById("view-count");

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function callAdmin(data) {
      const response = await app.callFunction({ name: FUNCTION_NAME, data });
      let result = response && response.result !== undefined ? response.result : response;
      if (typeof result === "string") {
        try { result = JSON.parse(result); } catch (_) {}
      }
      if (!result || result.ok !== true) {
        const error = result && result.error;
        const failure = new Error(error && error.message ? error.message : "云函数返回失败");
        failure.code = error && error.code ? error.code : "FUNCTION_FAILED";
        throw failure;
      }
      return result;
    }

    async function callAiWorker(data) {
      const response = await app.callFunction({ name: AI_FUNCTION_NAME, data });
      let result = response && response.result !== undefined ? response.result : response;
      if (typeof result === "string") {
        try { result = JSON.parse(result); } catch (_) {}
      }
      if (!result || result.ok !== true) {
        const error = result && result.error;
        const failure = new Error(error && error.message ? error.message : "AI 云函数返回失败");
        failure.code = error && error.code ? error.code : "AI_FUNCTION_FAILED";
        throw failure;
      }
      return result;
    }

    async function callMaterialWorker(data) {
      const response = await app.callFunction({ name: MATERIAL_FUNCTION_NAME, data });
      let result = response && response.result !== undefined ? response.result : response;
      if (typeof result === "string") {
        try { result = JSON.parse(result); } catch (_) {}
      }
      if (!result || result.ok !== true) {
        const error = result && result.error;
        const failure = new Error(error && error.message ? error.message : "材料识别云函数返回失败");
        failure.code = error && error.code ? error.code : "MATERIAL_FUNCTION_FAILED";
        throw failure;
      }
      return result;
    }

    function hasStableIdentity(user) {
      return Boolean(user && (user.email || user.username || user.phoneNumber));
    }

    async function checkCurrentSession() {
      const state = await auth.getLoginState();
      const user = state && state.user;
      if (!hasStableIdentity(user)) {
        loginPanel.classList.remove("hidden");
        adminPanel.classList.add("hidden");
        logoutButton.classList.add("hidden");
        return;
      }
      await verifyAdmin(user);
    }

    async function verifyAdmin(user) {
      try {
        const result = await callAdmin({ action: "whoami" });
        const uid = result.uid || user.uid || user.id || "";
        if (!result.adminConfigured) {
          throw Object.assign(new Error("云函数尚未配置 ADMIN_UIDS。"), { code: "ADMIN_NOT_CONFIGURED" });
        }
        if (!result.isAdmin) {
          loginPanel.classList.remove("hidden");
          adminPanel.classList.add("hidden");
          logoutButton.classList.remove("hidden");
          loginMessage.className = "mt-3 min-h-5 whitespace-pre-wrap text-xs text-red-600";
          loginMessage.textContent = `账号登录成功，但还不是管理员。\n请把这个稳定 UID 加入 ADMIN_UIDS：\n${uid}`;
          return;
        }
        loginPanel.classList.add("hidden");
        adminPanel.classList.remove("hidden");
        logoutButton.classList.remove("hidden");
        identity.textContent = `管理员：${user.email || user.username || user.phoneNumber || "已登录账号"} · 账号 ${maskedUid(uid)}`;
        await loadPending();
      } catch (error) {
        loginMessage.className = "mt-3 min-h-5 whitespace-pre-wrap text-xs text-red-600";
        loginMessage.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

    async function login(event) {
      event.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const button = event.currentTarget.querySelector("button");
      button.disabled = true;
      loginMessage.className = "mt-3 min-h-5 whitespace-pre-wrap text-xs text-stone-500";
      loginMessage.textContent = "正在登录...";
      try {
        if (await auth.getLoginState()) await auth.signOut();
        const state = await auth.signIn({ username, password });
        await verifyAdmin(state && state.user);
      } catch (error) {
        loginMessage.className = "mt-3 min-h-5 whitespace-pre-wrap text-xs text-red-600";
        loginMessage.textContent = error.message || "登录失败";
      } finally {
        button.disabled = false;
      }
    }

    async function resolveUrls(items) {
      const urls = new Map(items.filter((item) => item.fileUrl).map((item) => [item.imageFileID, item.fileUrl]));
      const fileList = [...new Set(items.filter((item) => !item.fileUrl).map((item) => item.imageFileID).filter(Boolean))];
      if (!fileList.length) return urls;
      const result = await app.getTempFileURL({ fileList });
      for (const file of result.fileList || []) {
        urls.set(file.fileID, file.tempFileURL || file.download_url || "");
      }
      return urls;
    }

    async function loadPending() {
      setActiveView("submissions", "待审投稿");
      message.className = "mt-2 text-xs text-stone-500";
      message.textContent = "正在读取待审投稿...";
      try {
        const result = await callAdmin({ action: "list", status: "pending", limit: 50 });
        const items = result.items || [];
        let urls = new Map();
        try { urls = await resolveUrls(items); } catch (_) {}
        renderItems(items, urls, result.resourceOptions || []);
        viewCount.textContent = `${items.length} 条`;
        message.className = "mt-2 text-xs text-emerald-700";
        message.textContent = `已读取 ${items.length} 条待审投稿。`;
      } catch (error) {
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

    async function loadSupplements() {
      setActiveView("supplements", "待审补充资料");
      message.className = "mt-2 text-xs text-stone-500";
      message.textContent = "正在读取待审补充资料...";
      try {
        const result = await callAdmin({ action: "listSupplements", limit: 50 });
        const items = result.items || [];
        renderSupplements(items);
        viewCount.textContent = `${items.length} 条`;
        message.className = "mt-2 text-xs text-emerald-700";
        message.textContent = `已读取 ${items.length} 条待审补充资料。`;
      } catch (error) {
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

    function renderSupplements(items) {
      if (!items.length) {
        list.innerHTML = '<div class="rounded-2xl border border-stone-200 bg-white p-6 text-sm text-stone-500">当前没有待审补充资料。</div>';
        return;
      }
      list.innerHTML = items.map((item) => {
        const preview = item.assetType === "image" && item.fileUrl
          ? `<img src="${escapeHtml(item.fileUrl)}" alt="补充资料预览" class="mt-3 max-h-72 w-full rounded-xl bg-stone-100 object-contain">`
          : item.assetType === "audio" && item.fileUrl
            ? `<audio src="${escapeHtml(item.fileUrl)}" controls class="mt-3 w-full"></audio>`
            : item.fileUrl
              ? `<a href="${escapeHtml(item.fileUrl)}" target="_blank" rel="noopener noreferrer" class="mt-3 inline-flex rounded-lg bg-stone-100 px-3 py-2 text-xs font-bold text-[#123c3a]">打开补充文件</a>`
              : '<p class="mt-3 text-xs text-amber-700">文件预览暂不可用，请刷新后重试。</p>';
        return `
          <article data-supplement-id="${escapeHtml(item.id)}" class="rounded-2xl border border-amber-100 bg-white p-4 shadow-sm">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="rounded-full bg-amber-50 px-2 py-1 text-[10px] font-bold text-amber-700">补充资料</span>
                  <span class="rounded-full bg-stone-100 px-2 py-1 text-[10px] font-bold text-stone-600">${escapeHtml(item.slotTitle)}</span>
                </div>
                <h3 class="mt-2 text-sm font-bold text-stone-800">原内容：${escapeHtml(item.submissionTitle || item.submissionId)}</h3>
                <p class="mt-1 text-xs text-stone-500">补充人：${escapeHtml(item.contributorName)} · 通过奖励 ${Number(item.rewardPoints || 0)} 积分</p>
                ${preview}
                <textarea rows="2" placeholder="退回时必须填写原因" class="mt-3 w-full rounded-xl border border-stone-200 p-3 text-xs outline-none focus:border-[#d9ad52]"></textarea>
              </div>
              <div class="flex shrink-0 flex-wrap gap-2">
                <button data-supplement-status="approved" class="rounded-lg bg-emerald-700 px-4 py-2 text-xs font-bold text-white">通过并合并</button>
                <button data-supplement-status="rejected" class="rounded-lg bg-red-700 px-4 py-2 text-xs font-bold text-white">退回</button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    async function reviewSupplement(card, status) {
      const supplementId = card.dataset.supplementId;
      const reviewNote = card.querySelector("textarea").value.trim();
      if (status === "rejected" && !reviewNote) {
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = "退回补充资料时必须填写原因。";
        return;
      }
      const buttons = card.querySelectorAll("button");
      buttons.forEach((button) => { button.disabled = true; });
      try {
        const result = await callAdmin({ action: "reviewSupplement", supplementId, status, reviewNote });
        card.remove();
        message.className = "mt-2 text-xs text-emerald-700";
        message.textContent = status === "approved"
          ? `补充资料已合并，内容完善度更新为 ${Number(result.completeness || 0)}%，已发放 ${Number(result.rewardPoints || 0)} 积分。`
          : "补充资料已退回。";
        if (!list.querySelector("article")) {
          list.innerHTML = '<div class="rounded-2xl border border-stone-200 bg-white p-6 text-sm text-stone-500">当前没有待审补充资料。</div>';
        }
      } catch (error) {
        buttons.forEach((button) => { button.disabled = false; });
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

    function maskedUid(uid) {
      const value = String(uid || "");
      return value.length > 8 ? `${value.slice(0, 4)}…${value.slice(-4)}` : value;
    }

    function initialReviewLabel(status) {
      return {
        not_requested: "等待人工复核",
        queued: "初审排队中",
        processing: "初审中",
        completed: "初审完成",
        failed: "已转人工复核",
        enqueue_failed: "已转人工复核"
      }[status] || "等待人工复核";
    }

    function setActiveView(view, title) {
      viewTitle.textContent = title;
      const commentFilters = document.getElementById("comment-filters");
      if (commentFilters) commentFilters.classList.toggle("hidden", view !== "comments");
      document.querySelectorAll("[data-admin-view]").forEach((button) => {
        const selected = button.dataset.adminView === view;
        button.className = selected
          ? "rounded-lg bg-[#123c3a] px-4 py-2 text-xs font-bold text-[#d9ad52]"
          : "rounded-lg border border-stone-200 bg-white px-4 py-2 text-xs font-bold text-stone-600";
      });
    }

    const commentStatusLabels = {
      visible: "公开中",
      hidden: "已隐藏",
      deleted: "用户已删除"
    };

    const commentTargetLabels = {
      submission: "社区投稿",
      hotspot: "濒危热点",
      landmark: "地图地标",
      activity: "社区活动",
      content: "发现内容"
    };

    function displayAdminDate(value) {
      if (!value) return "时间未知";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "时间未知" : date.toLocaleString("zh-CN");
    }

    async function loadComments() {
      setActiveView("comments", "评论管理");
      const status = document.getElementById("comment-status-filter").value;
      const targetType = document.getElementById("comment-target-filter").value;
      message.className = "mt-2 text-xs text-stone-500";
      message.textContent = "正在读取评论...";
      try {
        const result = await callAdmin({ action: "listComments", status, targetType, limit: 100 });
        const items = result.items || [];
        renderComments(items);
        viewCount.textContent = `${items.length} 条`;
        message.className = "mt-2 text-xs text-emerald-700";
        message.textContent = `已读取 ${items.length} 条评论。`;
      } catch (error) {
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

    function renderComments(items) {
      if (!items.length) {
        list.innerHTML = '<div class="rounded-2xl border border-stone-200 bg-white p-6 text-sm text-stone-500">当前筛选条件下没有评论。</div>';
        return;
      }
      list.innerHTML = items.map((item) => {
        const canHide = item.status === "visible";
        const canRestore = item.status === "hidden";
        const statusClass = item.status === "visible"
          ? "bg-emerald-50 text-emerald-700"
          : item.status === "hidden"
            ? "bg-red-50 text-red-700"
            : "bg-stone-100 text-stone-500";
        return `
          <article data-comment-id="${escapeHtml(item.id)}" class="rounded-2xl border border-stone-200 bg-white p-4 shadow-sm">
            <div class="flex flex-wrap items-start justify-between gap-4">
              <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="rounded-full px-2 py-1 text-[10px] font-bold ${statusClass}">${escapeHtml(commentStatusLabels[item.status] || item.status)}</span>
                  <span class="rounded-full bg-stone-100 px-2 py-1 text-[10px] font-bold text-stone-600">${escapeHtml(commentTargetLabels[item.targetType] || item.targetType)}</span>
                  ${item.parentId ? '<span class="rounded-full bg-[#d9ad52]/15 px-2 py-1 text-[10px] font-bold text-[#123c3a]">回复</span>' : ''}
                </div>
                <h3 class="mt-2 text-sm font-bold text-stone-800">${escapeHtml(item.targetTitle || "内容讨论")}</h3>
                <p class="mt-2 whitespace-pre-wrap break-words rounded-xl bg-stone-50 p-3 text-sm leading-relaxed text-stone-700">${escapeHtml(item.content || (item.status === "deleted" ? "该评论已由用户删除" : "无可显示内容"))}</p>
                <p class="mt-2 break-all text-[10px] leading-relaxed text-stone-400">作者：${escapeHtml(item.authorName || "社区用户")} · ${escapeHtml(displayAdminDate(item.createdAt))}<br>评论 ID：${escapeHtml(item.id)}<br>内容对象：${escapeHtml(item.targetType)} / ${escapeHtml(item.targetId)}${item.parentId ? `<br>回复评论：${escapeHtml(item.parentId)}` : ""}</p>
                ${(canHide || canRestore) ? '<textarea data-comment-note rows="2" placeholder="隐藏时必须填写原因；恢复时可填写说明" class="mt-3 w-full rounded-xl border border-stone-200 p-3 text-xs outline-none focus:border-[#123c3a]"></textarea>' : ''}
              </div>
              <div class="flex shrink-0 flex-wrap gap-2">
                ${canHide ? '<button data-comment-status="hidden" class="rounded-lg bg-red-700 px-3 py-2 text-xs font-bold text-white">隐藏评论</button>' : ''}

        <div class="overflow-x-auto rounded-2xl border border-stone-200 bg-white shadow-sm">

    function resourceBindingSelectHtml(item, resourceOptions, selectClass = "") {
      const selectedId = String(item.resourceId || "");
      const candidates = Array.isArray(item.resourceCandidates) ? item.resourceCandidates : [];
      const candidateIds = new Set(candidates.map((candidate) => candidate.id));
      const optionById = new Map((resourceOptions || []).map((option) => [option.id, option]));
      const selectedMissing = selectedId && !optionById.has(selectedId);
      const candidateOptions = candidates.map((candidate) => {
        const reason = (candidate.reasons || []).slice(0, 1).join(" · ");
        return `<option value="${escapeHtml(candidate.id)}" ${selectedId === candidate.id ? "selected" : ""}>候选：${escapeHtml(candidate.title)}${reason ? `｜${escapeHtml(reason)}` : ""}</option>`;
      }).join("");
      const otherOptions = (resourceOptions || [])
        .filter((option) => !candidateIds.has(option.id))
        .map((option) => `<option value="${escapeHtml(option.id)}" ${selectedId === option.id ? "selected" : ""}>${escapeHtml(option.regionName ? `${option.regionName}｜` : "")}${escapeHtml(option.title)}</option>`)
        .join("");
      return `
        <select data-resource-binding-select class="${selectClass} w-full rounded-xl border border-stone-200 bg-white px-3 py-2.5 text-xs outline-none focus:border-[#123c3a]">
          <option value="" ${selectedId ? "" : "selected"}>暂不关联资源</option>
          ${selectedMissing ? `<option value="${escapeHtml(selectedId)}" selected>当前关联：${escapeHtml(selectedId)}</option>` : ""}
          ${candidateOptions}
          ${otherOptions}
        </select>`;
    }

    function resourceCandidateHint(item) {
      const candidate = Array.isArray(item.resourceCandidates) ? item.resourceCandidates[0] : null;
      if (!candidate) return "系统未找到可靠候选，可留空或由管理员手动选择。";
      const reasons = (candidate.reasons || []).join(" · ");
      return `候选首位：${candidate.title}${reasons ? `（${reasons}）` : ""}。系统不会自动绑定，请人工确认。`;
    }

    async function loadResourceBindings() {
      setActiveView("resource-bindings", "已通过投稿关联");
      message.className = "mt-2 text-xs text-stone-500";
      message.textContent = "正在读取已通过投稿和资源候选...";
      list.innerHTML = '<div class="rounded-2xl border border-stone-200 bg-white p-6 text-sm text-stone-500">正在准备投稿关联工作台…</div>';
      try {
        const result = await callAdmin({ action: "list", status: "approved", limit: 50 });
        const items = result.items || [];
        renderResourceBindingItems(items, result.resourceOptions || []);
        viewCount.textContent = `${items.length} 条`;
        message.className = "mt-2 text-xs text-emerald-700";
        message.textContent = "只保存管理员明确选择的资源；留空不会自动归类。";
      } catch (error) {
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

    function renderResourceBindingItems(items, resourceOptions) {
      if (!items.length) {
        list.innerHTML = '<div class="rounded-2xl border border-stone-200 bg-white p-6 text-sm text-stone-500">当前没有已通过投稿。</div>';
        return;
      }
      list.innerHTML = items.map((item) => `
        <article data-binding-submission-id="${escapeHtml(item.id)}" class="rounded-2xl border border-stone-200 bg-white p-4 shadow-sm">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-2">
                <h3 class="font-bold text-stone-900">${escapeHtml(item.title || "未命名投稿")}</h3>
                <span class="rounded-full ${item.resourceId ? "bg-emerald-50 text-emerald-700" : "bg-amber-50 text-amber-700"} px-2 py-1 text-[10px] font-bold">${item.resourceId ? "已关联" : "待关联"}</span>
              </div>
              <p class="mt-1 text-xs leading-relaxed text-stone-500">${escapeHtml(item.description || "未填写说明")}</p>

          </div>

    async function saveResourceBinding(card, button) {
      const submissionId = card.dataset.bindingSubmissionId;
      const select = card.querySelector("[data-resource-binding-select]");
      const resourceId = select ? select.value : "";
      button.disabled = true;
      try {
        const result = await callAdmin({ action: "bindSubmissionResource", submissionId, resourceId });
        const successMessage = result.resourceId
          ? `已将投稿关联到：${result.resourceTitle || result.resourceId}`
          : "已取消这条投稿的资源关联。";
        await loadResourceBindings();
        message.className = "mt-2 text-xs text-emerald-700";
        message.textContent = successMessage;
      } catch (error) {
        button.disabled = false;
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

    function showResourceSeedConfirmation(button) {
      const card = button.closest("[data-resource-import-card]");
      if (!card) return;
      const panel = card.querySelector("[data-resource-confirm-panel]");
      const input = card.querySelector("[data-resource-confirm-input]");
      button.classList.add("hidden");
      panel.classList.remove("hidden");
      input.focus();
      message.className = "mt-2 text-xs text-stone-500";
      message.textContent = "请在页面确认栏输入指定文字。尚未写入数据。";
    }

    function cancelResourceSeedConfirmation(button) {
      const card = button.closest("[data-resource-import-card]");
      if (!card) return;
      const panel = card.querySelector("[data-resource-confirm-panel]");
      const prepareButton = card.querySelector("[data-resource-seed-prepare]");
      const input = card.querySelector("[data-resource-confirm-input]");
      const importButton = card.querySelector("[data-resource-seed-import]");
      input.value = "";
      importButton.disabled = true;
      panel.classList.add("hidden");
      prepareButton.classList.remove("hidden");
      message.className = "mt-2 text-xs text-stone-500";
      message.textContent = "已取消资源导入，没有写入数据。";
    }

    async function applyResourceSeed(button) {
      const missing = Math.max(0, Number(button.dataset.missing || 0));
      if (!missing) return;
      const confirmationText = `导入${missing}条资源`;
      const card = button.closest("[data-resource-import-card]");
      const input = card && card.querySelector("[data-resource-confirm-input]");
      if (!input || input.value.trim() !== confirmationText) {
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `确认文字不匹配，请输入“${confirmationText}”。`;
        return;
      }
      button.disabled = true;
      button.textContent = "正在导入...";
      message.className = "mt-2 text-xs text-stone-500";
      message.textContent = "正在创建缺失资源，请勿重复操作...";
      try {
        const result = await callAdmin({
          action: "applyResourceSeed",
          confirmToken: "IMPORT_RESOURCES_V1"
        });
        await loadResourceSeedPreview();
        message.className = "mt-2 text-xs text-emerald-700";
        message.textContent = `资源导入完成：新增 ${Number(result.created || 0)}，跳过 ${Number(result.skipped || 0)}，更新 0，删除 0。`;
      } catch (error) {
        button.disabled = false;
        button.textContent = "导入缺失资源";
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

        message.textContent = "链迹工作台已同步。";
      } catch (error) {
        message.className = "mt-2 text-xs text-red-600";

      event.preventDefault();
      const form = event.target;
      const button = form.querySelector('button[type="submit"]');
      const data = new FormData(form);
      button.disabled = true;
      try {
        await callAdmin({
          action: "saveStoryEvidenceLink",
          submissionId: data.get("submissionId"),
          resourceId: data.get("resourceId"),
          relationType: data.get("relationType"),
          evidenceSummary: data.get("evidenceSummary")
        });

        message.className = "mt-2 text-xs text-emerald-700";
        message.textContent = "链迹关系已确认，用户端现在可以看到这份资料来源。";

        button.disabled = false;
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `${error.code || "ERROR"}：${error.message}`;

        button.disabled = false;
        message.className = "mt-2 text-xs text-red-600";

    function renderStoryDraftWorkspace(result) {
      const resources = result.resources || [];
      const drafts = result.drafts || [];
      const claims = result.claimWorkspace && result.claimWorkspace.claims || [];
      const claimSources = new Map((result.claimWorkspace && result.claimWorkspace.sources || []).map((source) => [source.id, source]));
      const revisionImpacts = new Map((result.impactWorkspace && result.impactWorkspace.stories || []).map((item) => [item.storyId, item]));
      const gapTasks = result.gapTaskWorkspace && result.gapTaskWorkspace.tasks || [];
      const claimStatusLabels = { supported: "已有依据", needs_evidence: "待补依据", disputed: "存在争议" };
      const renderClaimTools = (draft) => {
        const storyClaims = claims.filter((claim) => claim.storyId === draft.id);
        const claimForms = (draft.chapters || []).map((chapter, chapterIndex) => {
          const chapterClaims = storyClaims.filter((claim) => Number(claim.chapterIndex) === chapterIndex);
          const sourceChoices = (chapter.sourceLinkIds || []).map((linkId) => {
            const source = claimSources.get(linkId) || {};
            return `<label class="flex items-start gap-2 rounded-lg border border-stone-200 bg-white p-2 text-[10px] text-stone-600"><input type="checkbox" name="sourceLinkIds" value="${escapeHtml(linkId)}" class="mt-0.5"> <span><strong class="block text-stone-700">${escapeHtml(source.label || "社区资料")}</strong><span class="mt-0.5 block leading-4 text-stone-400">${escapeHtml(source.evidenceSummary || linkId)}</span></span></label>`;
          }).join("");
          return `<section class="rounded-xl border border-stone-200 bg-stone-50 p-3">
            <div class="flex items-center justify-between gap-2"><strong class="text-xs text-stone-800">第 ${chapterIndex + 1} 章 · ${escapeHtml(chapter.title)}</strong><span class="text-[9px] text-stone-400">${chapterClaims.length} 条事实</span></div>
            <p class="mt-2 rounded-lg bg-white p-3 text-[10px] leading-5 text-stone-500">${escapeHtml(chapter.body)}</p>
            <form data-story-claim-form data-story-id="${escapeHtml(draft.id)}" data-chapter-index="${chapterIndex}" class="mt-3 space-y-2">
              <textarea name="claimText" rows="2" class="w-full rounded-lg border border-stone-200 bg-white p-3 text-xs leading-relaxed outline-none focus:border-[#9e2f24]" placeholder="从上方正文完整复制一句需要标注依据的话"></textarea>
              <div class="grid gap-2 sm:grid-cols-2">${sourceChoices}</div>
              <div class="flex flex-wrap items-center gap-2"><select name="status" class="rounded-lg border border-stone-200 bg-white px-3 py-2 text-xs"><option value="supported">确认已有依据</option><option value="needs_evidence">标记待补依据</option><option value="disputed">标记存在争议</option></select><button type="submit" class="rounded-lg bg-[#9e2f24] px-4 py-2 text-xs font-bold text-white">保存句级依据</button></div>
            </form>
            ${chapterClaims.length ? `<div class="mt-3 space-y-2">${chapterClaims.map((claim) => `<article data-story-claim-id="${escapeHtml(claim.id)}" class="rounded-lg border border-[#d8c6a7] bg-white p-3"><div class="flex flex-wrap items-start justify-between gap-2"><p class="min-w-0 flex-1 text-[10px] leading-5 text-stone-700">${escapeHtml(claim.claimText)}</p><span class="rounded-full bg-amber-50 px-2 py-1 text-[9px] font-bold text-amber-800">${escapeHtml(claimStatusLabels[claim.status] || claim.status)}</span></div><div class="mt-2 flex gap-2"><input data-story-claim-retire-reason class="min-w-0 flex-1 rounded-lg border border-stone-200 px-2 py-1.5 text-[10px]" placeholder="停用原因"><button type="button" data-story-claim-retire class="rounded-lg border border-red-200 px-3 py-1.5 text-[10px] font-bold text-red-700">停用</button></div></article>`).join("")}</div>` : ""}
          </section>`;

          </section>`;
        }).join("");
        return `
          <article data-story-draft-id="${escapeHtml(draft.id)}" class="rounded-2xl border ${isDraft ? "border-amber-200" : isPublished ? "border-emerald-200" : "border-stone-200"} bg-white p-5 shadow-sm">

              <label class="mt-3 block text-[10px] font-bold text-stone-600">导语<textarea data-story-introduction rows="3" ${isRevision ? "readonly" : ""} class="mt-1 w-full rounded-lg border border-stone-200 p-3 text-xs leading-relaxed outline-none focus:border-[#123c3a] ${isRevision ? "bg-stone-100 text-stone-500" : ""}">${escapeHtml(draft.introduction)}</textarea></label>

              <div class="mt-4 flex flex-wrap items-center justify-between gap-3 border-t border-stone-100 pt-4"><p class="text-[10px] text-stone-500">发布前请逐章核对文字和来源；AI 草稿不会自动公开。</p><button type="button" data-story-draft-publish class="rounded-xl bg-emerald-700 px-5 py-3 text-xs font-bold text-white">审核无误并发布</button></div>
            ` : `
              <h4 class="mt-4 text-lg font-bold text-stone-900">${escapeHtml(draft.title)}</h4><p class="mt-2 text-xs leading-relaxed text-stone-600">${escapeHtml(draft.introduction)}</p>
              ${qualitySlip}
              ${isPublished ? renderPublishedRevision(draft) : ""}
              ${isPublished ? renderImpactSuggestions(draft) : ""}

      }).join("") : '<div class="rounded-2xl border border-dashed border-stone-300 bg-white p-6 text-sm text-stone-500">还没有故事草稿。先选择一个已经拥有确认链迹的资源生成草稿。</div>';

          </form>

        </section>${cards}`;
    }

    async function loadStoryDrafts() {
      setActiveView("story-drafts", "故事草稿");
      viewCount.textContent = "正在读取";
      message.className = "mt-2 text-xs text-stone-500";
      message.textContent = "正在读取已确认链迹和故事版本，不会调用模型...";
      list.innerHTML = '<div class="rounded-2xl border border-stone-200 bg-white p-6 text-sm text-stone-500">正在准备故事工作台...</div>';
      try {
        const [result, claimWorkspace, impactWorkspace, gapTaskWorkspace] = await Promise.all([
          callAiWorker({ action: "getStoryDraftWorkspace" }),
          callAdmin({ action: "getStoryClaimWorkspace" }).catch(() => ({ claims: [], count: 0 })),
          callAdmin({ action: "getStoryRevisionImpactWorkspace" }).catch(() => ({ stories: [], counts: {} })),
          callAdmin({ action: "getStoryGapTaskWorkspace" }).catch(() => ({ tasks: [], count: 0 }))
        ]);
        result.claimWorkspace = claimWorkspace;
        result.impactWorkspace = impactWorkspace;
        result.gapTaskWorkspace = gapTaskWorkspace;
        renderStoryDraftWorkspace(result);

    async function reviewMaterialAnalysis(card, decision) {
      const analysisId = card.dataset.materialAnalysisId;
      const simulated = card.dataset.materialSimulated === "true";
      const textarea = card.querySelector("[data-material-reviewed-text]");
      const reviewedText = textarea ? textarea.value.trim() : "";
      if (decision === "approved" && !reviewedText) {
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = "确认前请填写校对后的文字。";
        return;
      }
      card.querySelectorAll("button").forEach((button) => { button.disabled = true; });
      try {
        await callMaterialWorker({ action: "reviewAnalysis", analysisId, decision, reviewedText });
        await loadMaterialAnalysis();
        message.textContent = decision === "approved"
          ? simulated
            ? "模拟识别结果已确认并留下审核记录；它仍不会进入正式故事。"
            : "真实识别结果已确认；可以在后续故事整合阶段使用，但不会自动发布。"
          : simulated ? "模拟识别结果已退回。" : "真实识别结果已退回。";
      } catch (error) {
        card.querySelectorAll("button").forEach((button) => { button.disabled = false; });
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

    async function review(card, status) {
      const submissionId = card.dataset.id;
      const reviewNote = card.querySelector("textarea").value.trim();
      const resourceSelect = card.querySelector("[data-resource-binding-select]");
      const resourceId = status === "approved" && resourceSelect ? resourceSelect.value : "";
      if (status !== "approved" && !reviewNote) {
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = "拒绝或要求修改时必须填写审核说明。";
        return;
      }
      const buttons = card.querySelectorAll("button");
      buttons.forEach((button) => { button.disabled = true; });
      try {
        const result = await callAdmin({ action: "review", submissionId, status, reviewNote, resourceId });
        card.remove();
        message.className = "mt-2 text-xs text-emerald-700";
        message.textContent = `审核完成：${submissionId} → ${status}${result.rewardPoints ? `，已发放 ${result.rewardPoints} 积分` : ""}${result.resourceId ? `，已关联 ${result.resourceTitle || result.resourceId}` : ""}`;
        if (!list.querySelector("article")) {
          list.innerHTML = '<div class="rounded-2xl border border-stone-200 bg-white p-6 text-sm text-stone-500">当前没有待审投稿。</div>';
        }
      } catch (error) {
        buttons.forEach((button) => { button.disabled = false; });
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

        moderateComment(commentCard, commentButton.dataset.commentStatus);
      }
      const reportButton = event.target.closest("button[data-resolution]");
      const reportCard = event.target.closest("article[data-report-id]");
      if (reportButton && reportCard) resolveReport(reportCard, reportButton.dataset.resolution);
      const feedbackButton = event.target.closest("button[data-feedback-resolution]");
      const feedbackCard = event.target.closest("article[data-feedback-id]");
      if (feedbackButton && feedbackCard) {
        resolveFeedback(feedbackCard, feedbackButton.dataset.feedbackResolution);
      }
      const redemptionButton = event.target.closest("button[data-redeem-code]");
      if (redemptionButton) redeemCode(redemptionButton.dataset.redeemCode, redemptionButton);
      const resourceImportButton = event.target.closest("button[data-resource-seed-import]");
      if (resourceImportButton) applyResourceSeed(resourceImportButton);
      const resourcePrepareButton = event.target.closest("button[data-resource-seed-prepare]");
      if (resourcePrepareButton) showResourceSeedConfirmation(resourcePrepareButton);
      const resourceCancelButton = event.target.closest("button[data-resource-seed-cancel]");
      if (resourceCancelButton) cancelResourceSeedConfirmation(resourceCancelButton);
      const storyArchiveButton = event.target.closest("button[data-story-link-archive]");
      const storyLinkCard = event.target.closest("article[data-story-link-id]");
      if (storyArchiveButton && storyLinkCard) archiveStoryLink(storyLinkCard);
      const aiTestButton = event.target.closest("button[data-ai-synthetic-test]");
      if (aiTestButton) runSyntheticAiTest(aiTestButton);
      const aiAnalyzeButton = event.target.closest("button[data-ai-analyze-submission]");
      if (aiAnalyzeButton) analyzeConsentedSubmission(aiAnalyzeButton);
      const materialSyntheticButton = event.target.closest("button[data-material-synthetic-test]");
      if (materialSyntheticButton) runSyntheticMaterialTest(materialSyntheticButton);
      const materialStartButton = event.target.closest("button[data-material-real-start]");
      if (materialStartButton) startRealMaterialAnalysis(materialStartButton);
      const materialReviewButton = event.target.closest("button[data-material-review]");
      const materialReviewCard = event.target.closest("[data-material-analysis-id]");
      if (materialReviewButton && materialReviewCard) {
        reviewMaterialAnalysis(materialReviewCard, materialReviewButton.dataset.materialReview);
      }
      const aiCandidateCard = event.target.closest("article[data-ai-candidate-id]");
      const aiConfirmButton = event.target.closest("button[data-ai-candidate-confirm]");
      if (aiCandidateCard && aiConfirmButton) confirmAiCandidate(aiCandidateCard);
      const aiRejectButton = event.target.closest("button[data-ai-candidate-reject]");
      if (aiCandidateCard && aiRejectButton) rejectAiCandidate(aiCandidateCard);
      const storyDraftCard = event.target.closest("article[data-story-draft-id]");
      const storyPublishButton = event.target.closest("button[data-story-draft-publish]");
      if (storyDraftCard && storyPublishButton) publishStoryDraft(storyDraftCard);
      const storyChainArchiveButton = event.target.closest("button[data-story-draft-archive]");
      if (storyDraftCard && storyChainArchiveButton) archiveStoryDraft(storyDraftCard);
      const storyClaimRetireButton = event.target.closest("button[data-story-claim-retire]");
      const storyClaimCard = event.target.closest("article[data-story-claim-id]");
      if (storyClaimRetireButton && storyClaimCard) retireStoryClaim(storyClaimCard, storyClaimRetireButton);
      const storyGapTaskCard = event.target.closest("article[data-story-gap-task-id]");
      if (storyGapTaskCard && event.target.closest("button[data-story-gap-task-archive]")) updateStoryGapTask(storyGapTaskCard, "archiveStoryGapTask");
      if (storyGapTaskCard && event.target.closest("button[data-story-gap-task-fulfill]")) updateStoryGapTask(storyGapTaskCard, "fulfillStoryGapTask");
      if (storyGapTaskCard && event.target.closest("button[data-story-gap-task-award]")) updateStoryGapTask(storyGapTaskCard, "awardStoryGapTask");
    });
    logoutButton.addEventListener("click", async () => {
      await auth.signOut();
      location.reload();
    });
    checkCurrentSession();
  </script>
</body>
</html>
