<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>楚韵链迹 · 云端管理审核台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { background: #f5f2e9; color: #172b2a; }
  </style>
</head>
<body class="min-h-screen">
  <header class="bg-[#123c3a] text-white shadow-lg">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-4">
      <div>
        <h1 class="text-xl font-bold text-[#d9ad52]">楚韵链迹 · 云端管理审核台</h1>
        <p class="mt-1 text-xs text-stone-300">稳定账号登录 · CloudBase 云函数审核 · 自动发放积分</p>
      </div>
      <div class="flex gap-2">
        <a href="./index.html" class="rounded-lg border border-white/20 px-3 py-2 text-xs font-bold">返回前台</a>
        <button id="logout" class="hidden rounded-lg bg-white/10 px-3 py-2 text-xs font-bold">退出登录</button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl space-y-5 px-4 py-6">
    <section id="login-panel" class="mx-auto max-w-md rounded-2xl border border-stone-200 bg-white p-5 shadow-sm">
      <h2 class="text-base font-bold">管理员登录</h2>
      <p class="mt-1 text-xs text-stone-500">使用 CloudBase 中创建的邮箱或用户名账号。</p>
      <form id="login-form" class="mt-4 space-y-3">
        <input id="username" autocomplete="username" placeholder="邮箱或用户名" class="w-full rounded-xl border border-stone-200 px-3 py-2.5 text-sm outline-none focus:border-[#d9ad52]" required>
        <input id="password" type="password" autocomplete="current-password" placeholder="密码" class="w-full rounded-xl border border-stone-200 px-3 py-2.5 text-sm outline-none focus:border-[#d9ad52]" required>
        <button type="submit" class="w-full rounded-xl bg-[#123c3a] px-3 py-2.5 text-sm font-bold text-[#d9ad52]">登录并验证管理员身份</button>
      </form>
      <p id="login-message" class="mt-3 min-h-5 whitespace-pre-wrap text-xs text-stone-500"></p>
    </section>

    <section id="admin-panel" class="hidden space-y-5">
      <div class="rounded-2xl border border-stone-200 bg-white p-4 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <p id="identity" class="break-all text-xs text-stone-600"></p>
            <p id="message" class="mt-2 text-xs text-emerald-700"></p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="refresh" class="rounded-lg bg-[#123c3a] px-4 py-2 text-xs font-bold text-[#d9ad52]">待审投稿</button>
            <button id="report-refresh" class="rounded-lg border border-red-200 bg-red-50 px-4 py-2 text-xs font-bold text-red-700">内容举报</button>
          </div>
        </div>
      </div>
      <div id="list" class="grid gap-4"></div>
    </section>
  </main>

  <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js"></script>
  <script>
    const ENV_ID = "chulink-legacy-d8god1687a5d60743";
    const REGION = "ap-shanghai";
    const FUNCTION_NAME = "adminSubmissions";
    const app = cloudbase.init({ env: ENV_ID, region: REGION });
    const auth = app.auth({ persistence: "local" });

    const loginPanel = document.getElementById("login-panel");
    const adminPanel = document.getElementById("admin-panel");
    const loginMessage = document.getElementById("login-message");
    const identity = document.getElementById("identity");
    const message = document.getElementById("message");
    const list = document.getElementById("list");
    const logoutButton = document.getElementById("logout");

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function callAdmin(data) {
      const response = await app.callFunction({ name: FUNCTION_NAME, data });
      let result = response && response.result !== undefined ? response.result : response;
      if (typeof result === "string") {
        try { result = JSON.parse(result); } catch (_) {}
      }
      if (!result || result.ok !== true) {
        const error = result && result.error;
        const failure = new Error(error && error.message ? error.message : "云函数返回失败");
        failure.code = error && error.code ? error.code : "FUNCTION_FAILED";
        throw failure;
      }
      return result;
    }

    function hasStableIdentity(user) {
      return Boolean(user && (user.email || user.username || user.phoneNumber));
    }

    async function checkCurrentSession() {
      const state = await auth.getLoginState();
      const user = state && state.user;
      if (!hasStableIdentity(user)) {
        loginPanel.classList.remove("hidden");
        adminPanel.classList.add("hidden");
        logoutButton.classList.add("hidden");
        return;
      }
      await verifyAdmin(user);
    }

    async function verifyAdmin(user) {
      try {
        const result = await callAdmin({ action: "whoami" });
        const uid = result.uid || user.uid || user.id || "";
        if (!result.adminConfigured) {
          throw Object.assign(new Error("云函数尚未配置 ADMIN_UIDS。"), { code: "ADMIN_NOT_CONFIGURED" });
        }
        if (!result.isAdmin) {
          loginPanel.classList.remove("hidden");
          adminPanel.classList.add("hidden");
          logoutButton.classList.remove("hidden");
          loginMessage.className = "mt-3 min-h-5 whitespace-pre-wrap text-xs text-red-600";
          loginMessage.textContent = `账号登录成功，但还不是管理员。\n请把这个稳定 UID 加入 ADMIN_UIDS：\n${uid}`;
          return;
        }
        loginPanel.classList.add("hidden");
        adminPanel.classList.remove("hidden");
        logoutButton.classList.remove("hidden");
        identity.textContent = `管理员：${user.email || user.username || user.phoneNumber || "已登录账号"} · UID ${uid}`;
        await loadPending();
      } catch (error) {
        loginMessage.className = "mt-3 min-h-5 whitespace-pre-wrap text-xs text-red-600";
        loginMessage.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

    async function login(event) {
      event.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const button = event.currentTarget.querySelector("button");
      button.disabled = true;
      loginMessage.className = "mt-3 min-h-5 whitespace-pre-wrap text-xs text-stone-500";
      loginMessage.textContent = "正在登录...";
      try {
        if (await auth.getLoginState()) await auth.signOut();
        const state = await auth.signIn({ username, password });
        await verifyAdmin(state && state.user);
      } catch (error) {
        loginMessage.className = "mt-3 min-h-5 whitespace-pre-wrap text-xs text-red-600";
        loginMessage.textContent = error.message || "登录失败";
      } finally {
        button.disabled = false;
      }
    }

    async function resolveUrls(items) {
      const urls = new Map(items.filter((item) => item.fileUrl).map((item) => [item.imageFileID, item.fileUrl]));
      const fileList = [...new Set(items.filter((item) => !item.fileUrl).map((item) => item.imageFileID).filter(Boolean))];
      if (!fileList.length) return urls;
      const result = await app.getTempFileURL({ fileList });
      for (const file of result.fileList || []) {
        urls.set(file.fileID, file.tempFileURL || file.download_url || "");
      }
      return urls;
    }

    async function loadPending() {
      message.className = "mt-2 text-xs text-stone-500";
      message.textContent = "正在读取待审投稿...";
      try {
        const result = await callAdmin({ action: "list", status: "pending", limit: 50 });
        const items = result.items || [];
        let urls = new Map();
        try { urls = await resolveUrls(items); } catch (_) {}
        renderItems(items, urls);
        message.className = "mt-2 text-xs text-emerald-700";
        message.textContent = `已读取 ${items.length} 条待审投稿。`;
      } catch (error) {
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

    const reportReasonLabels = {
      spam: "垃圾广告",
      abuse: "攻击或骚扰",
      false_information: "虚假信息",
      copyright: "侵权内容",
      other: "其他"
    };

    async function loadReports() {
      message.className = "mt-2 text-xs text-stone-500";
      message.textContent = "正在读取待处理举报...";
      try {
        const result = await callAdmin({ action: "listReports", limit: 50 });
        const items = result.items || [];
        renderReports(items);
        message.className = "mt-2 text-xs text-emerald-700";
        message.textContent = `已读取 ${items.length} 条待处理举报。`;
      } catch (error) {
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

    function renderReports(items) {
      if (!items.length) {
        list.innerHTML = '<div class="rounded-2xl border border-stone-200 bg-white p-6 text-sm text-stone-500">当前没有待处理举报。</div>';
        return;
      }
      list.innerHTML = items.map((item) => `
        <article data-report-id="${escapeHtml(item.id)}" class="rounded-2xl border border-red-100 bg-white p-4 shadow-sm">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <span class="rounded-full bg-red-50 px-2 py-1 text-[10px] font-bold text-red-700">${escapeHtml(item.targetType === "comment" ? "评论举报" : "作品举报")}</span>
                <span class="rounded-full bg-stone-100 px-2 py-1 text-[10px] font-bold text-stone-600">${escapeHtml(reportReasonLabels[item.reason] || item.reason)}</span>
              </div>
              <h3 class="mt-2 text-sm font-bold text-stone-800">${escapeHtml(item.submissionTitle || "未命名作品")}</h3>
              ${item.targetContent ? `<p class="mt-2 rounded-lg bg-stone-50 p-3 text-xs text-stone-700">被举报评论：${escapeHtml(item.targetContent)}</p>` : ""}
              <p class="mt-2 text-xs leading-relaxed text-stone-600">${escapeHtml(item.detail || "举报人未补充说明")}</p>
              <p class="mt-2 break-all text-[10px] text-stone-400">举报人：${escapeHtml(item.reporterName || item.reporterId)}<br>作品 ID：${escapeHtml(item.submissionId)}<br>目标 ID：${escapeHtml(item.targetId)}</p>
            </div>
            <div class="flex shrink-0 flex-wrap gap-2">
              <button data-resolution="resolved" class="rounded-lg bg-red-700 px-3 py-2 text-xs font-bold text-white">${item.targetType === "comment" ? "确认违规并隐藏" : "确认并标记处理"}</button>
              <button data-resolution="dismissed" class="rounded-lg bg-stone-200 px-3 py-2 text-xs font-bold text-stone-700">驳回举报</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    async function resolveReport(card, resolution) {
      const reportId = card.dataset.reportId;
      const resolutionNote = prompt(
        resolution === "resolved" ? "填写处理说明（可选）" : "填写驳回原因（可选）",
        ""
      );
      if (resolutionNote == null) return;
      const buttons = card.querySelectorAll("button");
      buttons.forEach((button) => { button.disabled = true; });
      try {
        const result = await callAdmin({
          action: "resolveReport",
          reportId,
          resolution,
          resolutionNote
        });
        card.remove();
        message.className = "mt-2 text-xs text-emerald-700";
        message.textContent = result.commentHidden
          ? "举报已处理，被举报评论已隐藏。"
          : "举报已处理。";
        if (!list.querySelector("article")) {
          list.innerHTML = '<div class="rounded-2xl border border-stone-200 bg-white p-6 text-sm text-stone-500">当前没有待处理举报。</div>';
        }
      } catch (error) {
        buttons.forEach((button) => { button.disabled = false; });
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

    function renderItems(items, urls) {
      if (!items.length) {
        list.innerHTML = '<div class="rounded-2xl border border-stone-200 bg-white p-6 text-sm text-stone-500">当前没有待审投稿。</div>';
        return;
      }
      list.innerHTML = items.map((item) => {
        const id = escapeHtml(item.id);
        const imageUrl = escapeHtml(urls.get(item.imageFileID) || "");
        return `
          <article data-id="${id}" class="grid gap-4 rounded-2xl border border-stone-200 bg-white p-4 shadow-sm md:grid-cols-[220px_1fr]">
            <div class="overflow-hidden rounded-xl bg-stone-100">
              ${item.assetType === "image" && imageUrl
                ? `<img src="${imageUrl}" alt="投稿图片" class="h-48 w-full object-cover">`
                : `<div class="flex h-48 items-center justify-center text-sm text-stone-400">${escapeHtml(item.assetType || "素材")}</div>`}
            </div>
            <div>
              <div class="flex flex-wrap items-start justify-between gap-2">
                <div>
                  <h3 class="font-bold">${escapeHtml(item.title || "未命名素材")}</h3>
                  <p class="mt-1 text-xs text-stone-500">${escapeHtml(item.description || "未填写说明")}</p>
                </div>
                <span class="rounded-full bg-amber-50 px-2 py-1 text-[10px] font-bold text-amber-700">待审核</span>
              </div>
              <p class="mt-3 break-all text-[10px] leading-relaxed text-stone-400">投稿人：${escapeHtml(item.contributorName || item.userId)}<br>投稿 ID：${id}<br>位置：${escapeHtml(item.regionName || "湖北")} ${escapeHtml(item.longitude)}，${escapeHtml(item.latitude)}<br>AI 初筛：${escapeHtml(item.aiReviewStatus || "not_requested")}${item.aiReviewSummary ? ` · ${escapeHtml(item.aiReviewSummary)}` : " · 当前由人工审核兜底"}<br>通过奖励：${Number(item.rewardPoints || 100)} 积分</p>
              <textarea rows="3" placeholder="拒绝或要求修改时必须填写审核说明" class="mt-3 w-full rounded-xl border border-stone-200 p-3 text-xs outline-none focus:border-[#d9ad52]"></textarea>
              <div class="mt-3 flex flex-wrap gap-2">
                <button data-status="approved" class="rounded-lg bg-emerald-700 px-4 py-2 text-xs font-bold text-white">通过并发积分</button>
                <button data-status="needs_revision" class="rounded-lg bg-amber-600 px-4 py-2 text-xs font-bold text-white">要求修改</button>
                <button data-status="rejected" class="rounded-lg bg-red-700 px-4 py-2 text-xs font-bold text-white">拒绝</button>
              </div>
            </div>
          </article>`;
      }).join("");
    }

    async function review(card, status) {
      const submissionId = card.dataset.id;
      const reviewNote = card.querySelector("textarea").value.trim();
      if (status !== "approved" && !reviewNote) {
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = "拒绝或要求修改时必须填写审核说明。";
        return;
      }
      const buttons = card.querySelectorAll("button");
      buttons.forEach((button) => { button.disabled = true; });
      try {
        const result = await callAdmin({ action: "review", submissionId, status, reviewNote });
        card.remove();
        message.className = "mt-2 text-xs text-emerald-700";
        message.textContent = `审核完成：${submissionId} → ${status}${result.rewardPoints ? `，已发放 ${result.rewardPoints} 积分` : ""}`;
        if (!list.querySelector("article")) {
          list.innerHTML = '<div class="rounded-2xl border border-stone-200 bg-white p-6 text-sm text-stone-500">当前没有待审投稿。</div>';
        }
      } catch (error) {
        buttons.forEach((button) => { button.disabled = false; });
        message.className = "mt-2 text-xs text-red-600";
        message.textContent = `${error.code || "ERROR"}：${error.message}`;
      }
    }

    document.getElementById("login-form").addEventListener("submit", login);
    document.getElementById("refresh").addEventListener("click", loadPending);
    document.getElementById("report-refresh").addEventListener("click", loadReports);
    document.getElementById("list").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-status]");
      const card = event.target.closest("article[data-id]");
      if (button && card) review(card, button.dataset.status);
      const reportButton = event.target.closest("button[data-resolution]");
      const reportCard = event.target.closest("article[data-report-id]");
      if (reportButton && reportCard) resolveReport(reportCard, reportButton.dataset.resolution);
    });
    logoutButton.addEventListener("click", async () => {
      await auth.signOut();
      location.reload();
    });
    checkCurrentSession();
  </script>
</body>
</html>
