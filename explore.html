<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>一处一寻 · 楚韵链迹</title><link rel="stylesheet" href="./static/explore.css"></head>
<body><div class="ex-shell" id="ex-shell"><header class="ex-top"><a href="./guide.html" aria-label="返回随行文化向导">‹ 随行</a><span class="ex-brand">楚韵链迹</span><button id="ex-menu-button" aria-expanded="false" aria-controls="ex-menu">手记</button></header>
<main><section class="ex-atlas" aria-label="探索地图"><div class="ex-title"><p id="ex-kicker">一处一寻 · 随行文化向导</p><h1 id="ex-title">展开一幅文化画卷</h1><p id="ex-notice">正在核对地点与资料……</p></div><div id="ex-map" class="ex-map" tabindex="0" aria-label="可拖动地图，方向键平移，加减号缩放"></div><div class="ex-map-tools"><button id="ex-home" aria-label="返回全图">全图</button><button id="ex-zoom-in" aria-label="放大地图">＋</button><button id="ex-zoom-out" aria-label="缩小地图">−</button></div><p class="ex-map-note" id="ex-map-note">点一处景物，慢慢看</p><div id="ex-point-list" class="ex-point-list" aria-label="选择观察点"></div></section>
<section id="ex-card" class="ex-card" aria-live="polite"><p class="ex-eyebrow">从眼前，读到从前</p><h2>点亮一处，展开一段故事</h2><p>选择地图上的景物，看看这里值得留意的细节。</p></section>

</main><aside id="ex-menu" class="ex-menu" hidden><h2>这一程的小手记</h2><div id="ex-records"></div><button id="ex-clear">清除本机手记</button><p>只保存你主动确认的观察点，不记录定位。</p><a id="ex-walk-link" href="./onsite.html">打开完整游览记录</a></aside></div>
