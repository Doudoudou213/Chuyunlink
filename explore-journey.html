<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <title>一卷随行 · 楚韵链迹</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="static/exploration-journey-demo.css">
  <link rel="stylesheet" href="static/exploration-journey-live.css">
  <!-- journey-local-adapter -->
  <script defer src="static/assets/gsap-3.15.0.min.js"></script>
  <script defer src="static/exploration-gilded-profiles.js"></script>
  <script defer src="static/exploration-gilded-reveal.js"></script>
  <script defer src="static/guide-cloud.js"></script>
  <script defer src="static/explore-transport.js"></script>
  <script defer src="static/exploration-journey-content.js"></script>
  <script defer src="static/exploration-journey-audio.js"></script>
  <script defer src="static/exploration-journey-live.js"></script>
</head>
<body>
  <header class="masthead"><a href="./index.html">楚韵链迹 <span>／ 一卷随行</span></a><span id="edition" class="prototype">正在核对当前公开版本</span></header>
  <main class="journey-shell">
    <section class="painting" aria-label="艺术画卷">
      <div class="painting-heading"><span>看一处景 · 读一段有出处的讲解</span><h1 id="painting-title">一卷黄鹤楼</h1></div>
      <div id="journey-stage" tabindex="0" role="region" aria-label="左右滚动画卷">
        <div id="journey-world"><img id="journey-art" src="static/assets/exploration-motion/hhl-full-park-v2.webp" alt="黄鹤楼艺术画稿，非实测地图" draggable="false"><canvas id="journey-light" hidden aria-hidden="true"></canvas><div id="journey-points"></div></div>
      </div>
      <p id="painting-help">画中位置仅为艺术示意，不用作现场导航。</p><p id="art-error" hidden>画稿暂未加载，文字阅读仍可使用。</p>
    </section>
    <section class="journal" aria-label="已审内容阅读">
      <div id="gate" role="status" aria-live="polite">
        <p class="overline">启卷 / 内容核对</p><h2 id="gate-title" tabindex="-1">正在展卷</h2>
        <p id="gate-copy" class="intro">读取当前可公开的讲解与素材，不显示过期缓存。</p>
        <button id="retry" class="primary" hidden>重新读取 →</button>
      </div>
      <div id="content" hidden>
        <div class="section-top"><p id="position" class="overline"></p><button id="refresh" class="quiet">检查内容更新</button></div>
        <h2 id="point-title" tabindex="-1"></h2>
        <nav id="journey-stops" aria-label="按已发布顺序阅读"></nav>
        <p class="prompt-label">先看一眼</p><p id="observation" class="observation"></p>
        <p id="binding-note" class="fine"></p>
        <section id="audio" class="audio-reading" aria-label="手动播放讲解"></section>
        <details id="reading"><summary>继续读讲解</summary><p id="reading-copy"></p></details>
        <details id="sources" class="source-details"><summary>出处与资料核对时间</summary><div id="source-list"></div><p id="review-date" class="fine"></p></details>
        <div class="step-actions"><button id="previous" class="quiet">上一景</button><button id="observe" class="primary">记下这一景，继续 →</button></div>
        <p class="fine">记下的是阅读观察，不认证到访、不发放积分。现场以景区标识和工作人员指引为准。</p>
        <button id="finish" class="quiet">先收起这一卷</button>
      </div>
      <div id="finished" hidden>
        <p class="overline">收卷 / 阅读拾记</p><h2 tabindex="-1" id="finished-title">把这一程，留在纸上</h2>
        <article class="souvenir"><div class="souvenir-picture" role="img" aria-label="艺术画卷"></div><div class="souvenir-copy"><span class="seal">阅读<br>拾记</span><h3 id="souvenir-title"></h3><p id="souvenir-count"></p><ul id="souvenir-stops"></ul><p id="souvenir-note"></p><small>仅记录主动阅读 · 非实地到访凭证</small></div></article>
        <label class="note-label" for="note">留一句感受 <span>本机保存，最多120字</span></label><textarea id="note" maxlength="120" rows="2"></textarea>
        <div class="step-actions"><button id="download" class="primary">保存游记文字</button><button id="return" class="quiet">回卷继续看</button></div>
      </div>
      <p id="status" role="status" aria-live="polite" class="fine"></p>
      <footer class="journal-footer"><span>进度仅留本机 · 不记录位置</span><button id="clear" class="quiet">清除本机拾记</button></footer>
      <noscript>请启用 JavaScript 读取当前公开资料。本页不提供离线旧讲解。</noscript>
    </section>
  </main>
</body></html>
