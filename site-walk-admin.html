<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>景点导览手册 · 楚韵链迹</title><link rel="stylesheet" href="./static/site-walk-admin.css"></head>
<body><main class="wa-page"><header><a href="./admin.html">‹ 返回管理首页</a><span>楚韵链迹</span></header><div class="wa-heading"><p>把一次游览，整理得清楚一些</p><h1>景点导览手册</h1><p>选取已有讲解，核实现场顺序，再交给游客。</p></div><p id="wa-message" role="status">正在检查管理员身份……</p><div id="wa-app" hidden><section aria-label="地点选择"><label for="wa-resource">选择地点</label><div class="wa-row"><select id="wa-resource"></select><button id="wa-load">打开导览</button><button id="wa-more" hidden>更多地点</button></div><p id="wa-state" class="wa-muted"></p></section><section id="wa-editor" hidden><label for="wa-title">导览名称</label><input id="wa-title" maxlength="100"><div class="wa-section-title"><h2>按现场顺序安排</h2><span>最多 12 处</span></div><div id="wa-points"></div><label for="wa-option">已有的观察材料</label><div class="wa-row"><select id="wa-option"></select><button id="wa-add">加入导览</button></div><p id="wa-option-detail" class="wa-muted"></p><p class="wa-muted">这里只能选取当前有效的已发布讲解。新发现、新叙述先在原后台核对，不能直接插入游览正文。</p><div class="wa-actions"><button id="wa-save" class="wa-primary">保存草稿</button><button id="wa-preview">预览与核对</button></div><section id="wa-review" hidden><h2>发布前，核对一次现场</h2><div id="wa-preview-content"></div><label>核实时间<input type="datetime-local" id="wa-checked"></label><label>有效至（最多 7 天）<input type="datetime-local" id="wa-until"></label><label>核实说明<textarea id="wa-note" maxlength="500" placeholder="如何核实位置、观察顺序、每段通行与当前参观条件"></textarea></label><label class="wa-check"><input type="checkbox" id="wa-confirm">我已核对全部观察点及通行方向，当前可以按此顺序参观</label><button id="wa-publish" class="wa-primary">发布这一版导览</button></section><details><summary>维护与历史版本</summary><p>某处或某段无法通行时，先暂停整条导览。修订后重新核对发布，旧版本仍保留。</p><label>暂停原因<input id="wa-pause-reason" maxlength="500"></label><button id="wa-pause">暂停公开导览</button><div id="wa-versions"></div><button id="wa-copy">用最新已发布版本重新修订</button></details></section></div></main>
<!-- site-walk-admin-adapter -->
<script src="./static/site-walk-admin.js"></script></body></html>
